<!doctype html>
<html lang="LANG"><head><meta charset="utf-8">
<title>Guía para empezar en fotografía · Matías Silva</title>
<style>
@font-face{font-family:Bodoni;src:url(../web/node_modules/@fontsource/bodoni-moda/files/bodoni-moda-latin-400-normal.woff2)}
@font-face{font-family:Bodoni;font-style:italic;src:url(../web/node_modules/@fontsource/bodoni-moda/files/bodoni-moda-latin-400-italic.woff2)}
@font-face{font-family:Work;src:url(../web/node_modules/@fontsource/work-sans/files/work-sans-latin-400-normal.woff2)}
@font-face{font-family:Work;font-weight:600;src:url(../web/node_modules/@fontsource/work-sans/files/work-sans-latin-600-normal.woff2)}
@font-face{font-family:Plex;src:url(../web/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2)}
@page{size:A4;margin:0}
:root{--ink:#111111;--muted:#5c5c5c;--line:#d6d6d6;--accent:#111111;--paper:#ffffff;--dark:#0d0d0d}
*{box-sizing:border-box}
body{margin:0;font:10.5pt/1.6 Work,sans-serif;color:var(--ink);background:var(--paper)}
.page{width:210mm;height:297mm;padding:22mm 20mm 20mm;position:relative;overflow:hidden;page-break-after:always;background:var(--paper)}
.page:last-child{page-break-after:auto}
.folio{position:absolute;left:20mm;right:20mm;bottom:11mm;display:flex;justify-content:space-between;font:7.5pt Plex,monospace;color:var(--muted);letter-spacing:.06em;border-top:1px solid var(--line);padding-top:3mm}
.eyebrow{font:8pt Plex,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 4mm}
h1{font:400 34pt/1.02 Bodoni,serif;margin:0 0 6mm}
h2{font:400 22pt/1.1 Bodoni,serif;margin:0 0 5mm}
h3{font:600 11pt Work,sans-serif;margin:6mm 0 2mm}
p{margin:0 0 3.2mm;max-width:150mm}
ul,ol{margin:0 0 3.5mm;padding-left:5mm;max-width:150mm}
li{margin-bottom:1.4mm}
strong{font-weight:600}
.num{font:italic 46pt/1 Bodoni,serif;color:var(--accent);margin-bottom:2mm}
.lead{font:400 13pt/1.45 Bodoni,serif;color:var(--ink);max-width:150mm;margin-bottom:6mm}
table{border-collapse:collapse;width:100%;margin:2mm 0 5mm;font-size:9pt;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:2.2mm 2.5mm;border-bottom:1px solid var(--line);vertical-align:top}
th{font:7.5pt Plex,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.box{border:1px solid var(--accent);padding:5mm 6mm;margin:4mm 0;max-width:160mm}
.box .eyebrow{margin-bottom:2mm}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.fig{margin:4mm 0 5mm}
.fig img{width:100%;display:block;object-fit:cover}
.fig figcaption{font:7.5pt/1.5 Plex,monospace;color:var(--muted);margin-top:2mm}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
.check li{list-style:none;position:relative;padding-left:6mm}
.check li::before{content:"";position:absolute;left:0;top:1.6mm;width:3mm;height:3mm;border:1px solid var(--accent)}
/* cover */
.cover{background:var(--dark);color:#f2f2f2;padding:0}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 70%}
.cover .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.25) 50%,rgba(0,0,0,.95) 80%)}
.cover .t{position:absolute;left:20mm;right:20mm;bottom:28mm}
.cover h1{font-size:46pt;color:#f2f2f2;margin-bottom:5mm}
.cover p{color:#cccccc;font-size:12pt;max-width:130mm}
.cover .eyebrow{color:#bdbdbd}
.cover .by{font:9pt Plex,monospace;letter-spacing:.08em;color:#b0b0b0;margin-top:10mm}
.dark{background:var(--dark);color:#f2f2f2}
.dark p{color:#cccccc}
.dark .folio{color:#9a9a9a;border-color:#333333}
.quote{font:italic 24pt/1.25 Bodoni,serif;max-width:150mm;margin:0 0 8mm}
.toc li{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:2.4mm 0;margin:0;list-style:none}
.toc{padding:0;max-width:160mm}
.toc span:last-child{font:8.5pt Plex,monospace;color:var(--muted)}
.week{border-top:1px solid var(--line);padding-top:3mm;margin-bottom:4mm}
.week b{font:400 13pt Bodoni,serif;display:block;margin-bottom:1mm}
</style></head><body>
